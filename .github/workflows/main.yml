name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Chiaki-NG source
        run: git clone --recurse-submodules https://github.com/streetpea/chiaki-ng.git chiaki-ng
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: chiaki-ng/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps5-phone-client-debug
          path: chiaki-ng/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
