name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --recurse-submodules https://github.com/streetpea/chiaki-ng.git chiaki-ng
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - working-directory: chiaki-ng/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-phone-client-debug
          path: chiaki-ng/android/app/build/outputs/apk/debug/app-debug.apk
